name: MedSim CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: medsim-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Node 22.14 requires opt-in TypeScript execution, including child processes.
      NODE_OPTIONS: --experimental-strip-types
      MEDSIM_LLM_PROVIDER: openrouter
      OPENROUTER_API_KEY: ''
      MEDSIM_LOCAL_LLM_ENABLED: 'false'
      PATIENT_TTS_PROVIDER: disabled
      PATIENT_TTS_FALLBACK: disabled
      PYTHONHASHSEED: '0'
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.14.0
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: 3.12.8
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Install frontend dependencies from lockfile
        run: npm ci

      - name: Install backend test dependencies only
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements-test.txt

      - name: Validate complete Vercel configuration
        run: npm run verify:vercel

      - name: TypeScript validation
        run: node node_modules/typescript/bin/tsc -b

      - name: Frontend tests
        run: npm test

      - name: Repository verification
        run: npm run verify

      - name: Clinical validation
        run: |
          npm run clinical:validate
          npm run clinical:verify-curation
          npm run clinical:validate-investigations
          npm run clinical:verify-generated

      - name: Security and runtime-artifact scan
        run: npm run security:scan

      - name: Lint and formatting contracts
        run: |
          npm run lint
          npm run format:check
          ruff check backend api scripts/clinical/verify-review-workbook.py

      - name: Backend tests with inference and TTS disabled
        run: python -m unittest discover -s backend/tests -v

      - name: Production build
        run: |
          npm run build
          npm run security:scan-frontend
          npm run build:demo
          node scripts/verify/frontend-answer-leakage.ts dist-demo

      - name: Diff integrity
        run: git diff --check
